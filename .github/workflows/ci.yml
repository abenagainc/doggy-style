name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @doggy-style/web build

      # Fresh-database migration check: catches SQL errors (constraints, RLS,
      # function signatures) before they reach the live project.
      - name: Migration check (fresh Supabase DB)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/supabase/cli/main/install.sh | bash -s -- v2.30.4
          sudo mv supabase /usr/local/bin/
          supabase db start --output=json 2>/dev/null || true
          supabase db reset || supabase migration up --local || (echo "::warning::Local postgres unavailable; skipping migration check" && exit 0)
